name: Deploy to Xserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      # 同期先を /thumbnail/ に限定し、他ツールのディレクトリへ影響させない。
      - name: Deploy app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /tools.vrceve.com/public_html/thumbnail/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

      # ホストルートは共通資産のみ。状態ファイルを分けることで /thumbnail/ を削除対象に含めない。
      - name: Deploy host root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/host-root/
          server-dir: /tools.vrceve.com/public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-host-root-state.json
